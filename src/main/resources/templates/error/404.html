<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        .error-container { margin: 50px; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        .error-msg { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>
<div class="error-container">
    <h1>페이지를 찾을 수 없습니다 (404)</h1>
    <hr>
    <p>요청하신 정보를 찾을 수 없습니다.</p>
    <ul>
        <li><strong>에러 코드: </strong><span class="error-msg" th:text="${errorCode}">에러 코드</span> </li>
        <li><strong>에러 메시지:</strong> <span class="error-msg" th:text="${errorMessage}">에러 내용</span></li>
        <li><strong>발생 시각:</strong> <span th:text="${#temporals.format(timestamp, 'yyyy-MM-dd')}">2026-04-13</span></li>
    </ul>
    <hr>
    <button onclick="history.back()">이전으로</button>
    <a href="/login"><button>로그인 화면으로</button></a>
</div>
</body>
</html>
