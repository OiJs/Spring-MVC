<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.notFound.title}">404 Not Found</title>
    <style>
        .error-container { margin: 50/px; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        .error-msg { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>
<div class="error-container">
    <h1 th:text="#{error.notFound.title}">페이지를 찾을 수 없습니다 (404)</h1>
    <hr>
    <p th:text="#{error.notFound.description}">요청하신 정보를 찾을 수 없습니다.</p>
    <ul>
        <li><strong th:text="#{error.label.code}">에러 코드: </strong><span class="error-msg" th:text="${errorCode}">에러 코드</span> </li>
        <li><strong th:text="#{error.label.message}">에러 메시지:</strong> <span class="error-msg" th:text="${errorMessage}">에러 내용</span></li>
        <li><strong th:text="#{error.label.timestamp}">발생 시각:</strong> <span th:text="${#temporals.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}">2026-04-13</span></li>
    </ul>
    <hr>
    <button onclick="history.back()" th:text="#{error.button.back}">이전으로</button>
    <a href="/login"><button th:text="#{error.button.login}">로그인 화면으로</button></a>
</div>
</body>
</html>
