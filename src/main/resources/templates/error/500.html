<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.serverr.title}">500 Internal Server Error</title>
    <style>
        .error-container { margin: 50px; padding: 20px; border: 1px solid #ff0000; border-radius: 10px; background-color: #fffafa; }
        .error-msg { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>
<div class="error-container">
    <h1 th:text="#{error.serverr.title}">서버 내부 오류 (500)</h1>
    <hr>
    <p th:text="#{error.serverr.description}">서버에서 처리 중 예상치 못한 오류가 발생했습니다.</p>
    <div>
        <p><strong th:text="#{error.label.code}">에러 코드: </strong><span class="error-msg" th:text="${errorCode}">에러 코드</span> </p>
        <p><strong th:text="#{error.label.cause}">상세 원인:</strong> <span class="error-msg" th:text="${errorMessage}">시스템 오류 발생</span></p>
        <p><strong th:text="#{error.label.timestamp}">발생 시각:</strong> <span th:text="${#temporals.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}">2026-04-13</span></p>
    </div>
    <hr>
    <p th:text="#{error.serverr.contact}">문제가 지속되면 관리자에게 문의해 주세요.</p>
    <button onclick="history.back()" th:text="#{error.button.back}">이전으로</button>
    <a href="/"><button th:text="#{error.button.main}">메인으로</button></a>
</div>
</body>
</html>
